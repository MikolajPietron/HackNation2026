[project]
name = "zasilkowy-przewodnik-api"
version = "0.1.0"
description = "Backend: silnik reguł zasiłków (oś czasu rodzica), asystent z cytatami, odczyt spraw ZUS"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi[standard]>=0.165.0",
    "pillow>=13.0.0",
    "pydantic-ai-slim[anthropic,google,openrouter]>=2.71.0",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "supabase>=2.34.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
